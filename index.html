<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14823b">
<title>Thursday Soccer</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f5;margin:0;color:#152018}
.app{max-width:720px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
h1{text-align:center;font-size:40px}
input,button{font:inherit}
input{width:100%;padding:14px;border:1px solid #ccd4cd;border-radius:12px;box-sizing:border-box;font-size:18px}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700}
.primary{background:#14823b;color:white}.danger{background:#ffecec;color:#a22}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.player{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.ok{color:#14823b}.bad{color:#b33}.muted{color:#6d746f;font-size:13px}.hidden{display:none}
.status{font-weight:700}
.money-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.money-box{background:#f5f7f5;border-radius:12px;padding:12px}
.money-box span{display:block;font-size:12px;color:#6d746f}
.money-box b{font-size:20px}
</style>
</head>
<body>
<div class="app">
<h1>⚽ Thursday Soccer</h1>

<div class="card">
  <div id="summary" class="status">Loading...</div>
  <div id="weekText" class="muted"></div>
  <div id="financeCard" class="money-grid hidden">
    <div class="money-box"><span>Balance from Last Week</span><b id="openingBalance">$0</b></div>
    <div class="money-box"><span>This Week Collected</span><b id="collectedAmount">$0</b></div>
    <div class="money-box"><span>Field Rent</span><b id="fieldRent">$120</b></div>
    <div class="money-box"><span>New Balance</span><b id="newBalance">$0</b></div>
  </div>
</div>

<div class="card" id="loginCard">
  <h2>Admin Login</h2>
  <input id="email" type="email" placeholder="Admin Email">
  <button class="primary" style="margin-top:10px;width:100%" onclick="sendLogin()">Send Login Link</button>
  <div class="muted" style="margin-top:8px">Only the admin signs in to make changes. Everyone else can view payment status.</div>
</div>

<div class="card hidden" id="adminCard">
  <div class="row"><b>Admin</b><button onclick="signOut()">Sign Out</button></div>
  <div class="row" style="margin-top:12px">
    <input id="newPlayer" placeholder="Player name">
    <button class="primary" onclick="addPlayer()">Add</button>
  </div>
  <h3 style="margin-top:22px">Payment Settings</h3>
  <input id="cashTag" placeholder="Cash App $Cashtag">
  <input id="venmoUrl" placeholder="Venmo link (https://venmo.com/...)" style="margin-top:8px">
  <button class="primary" style="margin-top:10px;width:100%" onclick="savePaymentSettings()">Save Payment Settings</button>
</div>

<div class="card" id="payCard">
  <h2>Pay $10</h2>
  <div class="row">
    <button class="primary" style="flex:1" onclick="openCashApp()">Pay with Cash App</button>
    <button class="primary" style="flex:1" onclick="openVenmo()">Pay with Venmo</button>
  </div>
  <div class="muted" style="margin-top:8px">After payment, the admin marks the player as paid.</div>
</div>

<div class="card">
  <h2>Players</h2>
  <div id="players"></div>
</div>
</div>

<script>
const SB_URL="https://aacbfebgypzrnvgcrrta.supabase.co";
const SB_KEY="sb_publishable_Sk-be4OXcsyglT8HsEqngw_GLVQzZ-5";
let accessToken=localStorage.getItem("ts_access_token")||"";
let userId=localStorage.getItem("ts_user_id")||"";
let team=null,week=null,players=[],payments=[];

function setStatus(msg,error=false){const e=document.getElementById("summary");e.textContent=msg;e.style.color=error?"#b33":"#152018"}
function money(n){return "$"+Number(n||0).toFixed(2).replace(".00","")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mondayISO(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function decodeJwt(token){try{const part=token.split(".")[1];const json=decodeURIComponent(atob(part.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));return JSON.parse(json)}catch(e){return null}}
function captureLoginFromUrl(){if(location.hash.includes("access_token=")){const p=new URLSearchParams(location.hash.slice(1));const token=p.get("access_token");if(token){accessToken=token;const jwt=decodeJwt(token);if(jwt?.sub)userId=jwt.sub;localStorage.setItem("ts_access_token",accessToken);localStorage.setItem("ts_user_id",userId);history.replaceState(null,"",location.pathname)}}}
async function api(path,options={}){const headers={"apikey":SB_KEY,"Content-Type":"application/json","Prefer":options.prefer||"return=representation"};if(accessToken)headers["Authorization"]="Bearer "+accessToken;const res=await fetch(SB_URL+path,{method:options.method||"GET",headers,body:options.body?JSON.stringify(options.body):undefined});const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch(e){data=text}if(!res.ok){const msg=(data&&(data.message||data.msg||data.error_description||data.error))||("HTTP "+res.status);throw new Error(msg)}return data}
async function sendLogin(){const email=document.getElementById("email").value.trim();if(!email)return alert("Enter your email.");setStatus("Sending login link...");try{const res=await fetch(SB_URL+"/auth/v1/otp?redirect_to="+encodeURIComponent(location.origin+location.pathname),{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,create_user:true})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.msg||data.message||data.error_description||"Could not send email");setStatus("Login link sent. Check your email.");alert("A login link was sent to your email.")}catch(e){setStatus("Login error: "+e.message,true);alert(e.message)}}
function signOut(){localStorage.removeItem("ts_access_token");localStorage.removeItem("ts_user_id");accessToken="";userId="";location.reload()}
async function calculateOpeningBalance(start){
  try{
    const previousWeeks=await api("/rest/v1/weeks?team_id=eq."+team.id+"&starts_on=lt."+start+"&select=id,starts_on&order=starts_on.desc&limit=1");
    if(!previousWeeks.length) return 0;
    const prev=previousWeeks[0];
    const prevPayments=await api("/rest/v1/payments?week_id=eq."+prev.id+"&select=amount");
    const prevCollected=prevPayments.reduce((s,p)=>s+Number(p.amount),0);
    return prevCollected-120;
  }catch(e){ return 0; }
}
async function ensureTeamAndWeek(){
  if(userId){
    let owned=await api("/rest/v1/teams?owner_id=eq."+encodeURIComponent(userId)+"&select=*&limit=1");
    if(!owned.length){
      owned=await api("/rest/v1/teams",{method:"POST",body:{name:"Thursday Soccer",weekly_fee:10,owner_id:userId}});
    }
    team=owned[0];
  }
  if(!team){
    const list=await api("/rest/v1/teams?select=*&order=created_at.asc&limit=1");
    if(list.length) team=list[0];
  }
  if(!team) return;
  const start=mondayISO();
  let weeks=await api("/rest/v1/weeks?team_id=eq."+team.id+"&starts_on=eq."+start+"&select=*&limit=1");
  if(!weeks.length && userId && team.owner_id===userId){
    weeks=await api("/rest/v1/weeks",{method:"POST",body:{team_id:team.id,starts_on:start,label:start}});
  }
  week=weeks[0]||null;
}
async function load(){captureLoginFromUrl();document.getElementById("loginCard").classList.toggle("hidden",!!userId);document.getElementById("adminCard").classList.toggle("hidden",!userId);setStatus("Loading...");try{await ensureTeamAndWeek();if(!team){setStatus("No team has been created yet.");document.getElementById("weekText").textContent="Admin: sign in to create Thursday Soccer.";return}players=await api("/rest/v1/players?team_id=eq."+team.id+"&active=eq.true&select=*&order=created_at.asc");payments=week?await api("/rest/v1/payments?week_id=eq."+week.id+"&select=*"):[];render()}catch(e){setStatus("Connection error: "+e.message,true);document.getElementById("weekText").textContent="Please refresh after checking the connection."}}
function render(){const paidIds=new Set(payments.map(x=>x.player_id));const cashInput=document.getElementById("cashTag");const venmoInput=document.getElementById("venmoUrl");if(cashInput)cashInput.value=team?.cash_tag||"";if(venmoInput)venmoInput.value=team?.venmo_url||"";const collected=payments.reduce((s,x)=>s+Number(x.amount),0);setStatus(paidIds.size+"/"+players.length+" Paid • "+money(collected)+" Collected");document.getElementById("weekText").textContent=week?"Week of "+week.starts_on+" • "+money(team.weekly_fee)+" per player":"Current week not created yet";const finance=document.getElementById("financeCard");finance.classList.toggle("hidden",!week);if(week){
    const rent=120;
    document.getElementById("collectedAmount").textContent=money(collected);
    document.getElementById("fieldRent").textContent=money(rent);
    calculateOpeningBalance(week.starts_on).then(opening=>{
      const balance=opening+collected-rent;
      document.getElementById("openingBalance").textContent=money(opening);
      document.getElementById("newBalance").textContent=money(balance);
      document.getElementById("newBalance").className=balance>=0?"ok":"bad";
    });
  }const isOwner=userId&&team.owner_id===userId;document.getElementById("players").innerHTML=players.length?players.map(p=>{const paid=paidIds.has(p.id);const action=isOwner?(paid?'<button class="danger" onclick="markUnpaid(\\''+p.id+'\\')">Mark Unpaid</button>':'<button class="primary" onclick="markPaid(\\''+p.id+'\\')">Mark Paid</button>'):'';return '<div class="player"><div><b>'+escapeHtml(p.name)+'</b><div class="'+(paid?'ok':'bad')+'">'+(paid?'✅ Paid':'❌ Unpaid')+'</div></div>'+action+'</div>'}).join(""):'<div class="muted">No players added yet.</div>'}
async function savePaymentSettings(){if(!team||!userId)return;const cashTag=document.getElementById("cashTag").value.trim().replace(/^\\$/,"");const venmoUrl=document.getElementById("venmoUrl").value.trim();try{await api("/rest/v1/teams?id=eq."+team.id,{method:"PATCH",body:{cash_tag:cashTag||null,venmo_url:venmoUrl||null}});team.cash_tag=cashTag||null;team.venmo_url=venmoUrl||null;alert("Payment settings saved.")}catch(e){alert(e.message)}}
function openCashApp(){if(!team?.cash_tag)return alert("Cash App is not set up yet.");location.href="https://cash.app/$"+encodeURIComponent(String(team.cash_tag).replace(/^\\$/,""))}
function openVenmo(){if(!team?.venmo_url)return alert("Venmo is not set up yet.");location.href=team.venmo_url}
async function addPlayer(){const input=document.getElementById("newPlayer"),name=input.value.trim();if(!name||!team||!userId)return;try{await api("/rest/v1/players",{method:"POST",body:{team_id:team.id,name}});input.value="";await load()}catch(e){alert(e.message)}}
async function markPaid(player_id){if(!team||!week||!userId)return;try{await api("/rest/v1/payments",{method:"POST",body:{team_id:team.id,week_id:week.id,player_id,amount:team.weekly_fee,method:"other",created_by:userId}});await load()}catch(e){alert(e.message)}}
async function markUnpaid(player_id){if(!week||!userId)return;try{await api("/rest/v1/payments?week_id=eq."+week.id+"&player_id=eq."+player_id,{method:"DELETE"});await load()}catch(e){alert(e.message)}}
load();
</script>
</body>
</html>
